warnings:
  - This is continuously rebuilt pre-release software on a resettable prototype testnet.
  - prototype-2026w36 requires a Musashi respin; do not assume the registered nodes have been migrated until independently verified. Preserve prior local state before removing it and re-sync with the current configuration.
  - prototype-2026w36 changes committee selection, protocol-parameter handling, BLS proof-of-possession semantics, and Dijkstra block structures. Previous BLS proofs and registrations must be revalidated with the w36 cardano-cli.
  - The getting-started guide still embeds prototype-2026w30 examples; use w36 assets, release notes, and the live Musashi configuration while retaining its non-version-specific procedures.
  - For prototype-2026w36, verify the running executable and git rev against the official archive checksum and release asset; use unknown when any evidence is missing.
  - The guide documents a w30 container image; availability of a w36 image is not confirmed by the release page.
  - Block-producer BLS proofs and registrations from earlier releases are not automatically compatible with prototype-2026w36; use the w36 cardano-cli and revalidate the registered key.
  - Operational certificates issued before a respin are stale until a fully synced current tip is used to recalculate the KES period and issue a new certificate with the monotonic opcert.counter.
  - Never substitute Cardano mainnet operating values or procedures.

