schema_version: 1
network_id: musashi
verified_at: "2026-08-12T09:46:20Z"

authority:
  operational_guide: https://leios.cardano-scaling.org/docs/testnet/getting-started/
  releases: https://github.com/input-output-hk/ouroboros-leios/releases
  policy: The release repository determines the latest version; the Musashi guide determines configuration and procedures. Both override Cardano mainnet material.

issues:
  - id: prototype-is-volatile
    status: current
    severity: high
    summary: The testnet uses continuously rebuilt pre-release software and may reset or re-pin configuration every few weeks.
    action: Recheck all network declarations before installation, update, or recovery.
    source: https://leios.cardano-scaling.org/docs/testnet/getting-started/#where-to-start

  - id: sync-is-slow-or-bursty
    status: current
    severity: medium
    summary: Few upstream relays and an unoptimized catch-up path can cause long pauses followed by jumps in sync progress.
    action: Wait, retry later, or restart; report persistent stalls with version and logs.
    source: https://leios.cardano-scaling.org/docs/testnet/getting-started/#confirm-you-are-syncing

  - id: selected-release-musashi-respin
    status: current
    severity: high
    summary: prototype-2026w32 explicitly respins Musashi and invalidates local chain state from the predecessor release.
    action: Preserve the prior database, then quarantine or remove only that node's local state and re-sync from genesis or an explicitly verified IOG sideload using the current Musashi configuration. Require separate destructive confirmation.
    source: https://github.com/input-output-hk/ouroboros-leios/releases/tag/prototype-2026w32

  - id: operational-certificate-stale-after-respin
    status: current
    severity: high
    summary: A Musashi respin changes the network incarnation and current tip context; an operational certificate issued before the respin must not be reused by the new producer.
    action: Preserve the prior certificate and evidence, wait for syncProgress 100.00 on the current configuration, calculate floor(tip.slot / slotsPerKESPeriod) from the current Shelley genesis, issue a new certificate, and increment opcert.counter without resetting it.
    sources:
      - https://github.com/input-output-hk/ouroboros-leios/releases/tag/prototype-2026w32
      - https://leios.cardano-scaling.org/docs/testnet/register-stake-pool/#operational-certificate

  - id: selected-release-bls-voting-key
    status: current
    severity: high
    summary: A block producer on prototype-2026w32 votes only when started with --shelley-bls-key pointing to the BLS signing key whose verification key is registered on-chain.
    action: Verify the registered BLS key and pass the exact signing-key path to the producer. Without it, the node operates as a non-voting relay.
    source: https://github.com/input-output-hk/ouroboros-leios/releases/tag/prototype-2026w32

  - id: selected-release-invalid-certificate-hotfix
    status: historical
    severity: medium
    summary: prototype-2026w31a prevents invalid Leios certificate errors from crashing the node and emits InvalidBlock traces instead.
    action: If crashes continue after updating, first delete only the volatile chain state as directed by the release notes.
    source: https://github.com/input-output-hk/ouroboros-leios/releases/tag/prototype-2026w31a

  - id: getting-started-release-lag
    status: current
    severity: high
    summary: The operational guide still embeds w30 release downloads and container examples while the release repository and live Musashi page select w32.
    action: Use w32 release assets and release notes, and use the live Musashi configuration. Retain only the guide's non-version-specific procedures; keep unverified w32 container equivalents unknown.
    sources:
      - https://leios.cardano-scaling.org/docs/testnet/getting-started/
      - https://github.com/input-output-hk/ouroboros-leios/releases

  - id: operations-book-release-lag
    status: current
    severity: medium
    summary: The Operations Book and release repository can change independently; the live page currently points to w32.
    action: Use its live configuration links only after comparing hashes with current.yaml; use the release repository to select the release.
    sources:
      - https://book.play.dev.cardano.org/adv-musashi.html
      - https://github.com/input-output-hk/ouroboros-leios/releases

  - id: selected-release-node-provenance-verification
    status: current
    severity: medium
    summary: The exact Nix cardano-node version is verified by comparing the running binary git rev with the cardano-node input revision pinned in the selected release flake.lock.
    action: Resolve /proc/<pid>/exe, run the resolved binary with --version, and compare its input-output-hk/cardano-node git rev with the selected release flake.lock. Use unknown when the binary, revision, or lock file cannot be verified.
    source: https://github.com/input-output-hk/ouroboros-leios/releases/tag/prototype-2026w32

  - id: unpinned-nix-flake
    status: current
    severity: medium
    summary: The documented Nix command follows an unpinned repository flake and may resolve newer code than the guide-selected release.
    action: Inspect cardano-node --version and reconcile it with current.yaml before treating it as the selected release.
    source: https://leios.cardano-scaling.org/docs/testnet/getting-started/#nix

  - id: dijkstra-tooling-is-rough
    status: current
    severity: medium
    summary: Not all Cardano tooling is Dijkstra-era ready.
    action: Do not assume mainnet tools or Conway-era commands are compatible.
    source: https://leios.cardano-scaling.org/docs/testnet/getting-started/#what-to-expect-in-the-early-days

  - id: bls-registration-not-active
    status: historical
    severity: medium
    summary: The predecessor documentation said Musashi did not utilize the BLS key yet; prototype-2026w32 now requires it for block-producer voting.
    action: Follow the w32 release notes and verify the producer command separately.
    source: https://leios.cardano-scaling.org/docs/testnet/register-stake-pool/#register-stake-address-and-pool

  - id: live-configuration-is-mutable
    status: current
    severity: high
    summary: pin-config.sh downloads mutable live files from the Operations Book deployment.
    action: Compare content hashes with current.yaml and mark declarations stale before using changed files.
    source: https://raw.githubusercontent.com/input-output-hk/ouroboros-leios/main/testnet/pin-config.sh

freshness:
  status: current-as-reviewed
  review_before_use: true
  stale_when:
    - The latest official non-draft release changes.
    - Any cited operational page changes.
    - The selected release, topology, peer snapshot, or network-identity projection changes.
