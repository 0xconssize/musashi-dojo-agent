  release_authority:
    url: https://github.com/input-output-hk/ouroboros-leios/releases
    latest_release: prototype-2026w31a
    retrieved_at: "2026-08-05"
freshness:
  status: current-as-reviewed
  revalidate_before: Comparing a host with current requirements.
