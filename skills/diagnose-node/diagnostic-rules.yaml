schema_version: 1
skill: diagnose-node
phase: 6
risk: read-only
scope: [single-node]
inputs: [node_id, symptom, evidence_window, runtime_capabilities]
outputs: [diagnostic_report]
success: Findings are evidence-backed, sanitized, reproducible, and separate unknowns from likely causes.

rules:
  - id: host-capacity
    check: Compare observed CPU, memory, SSD space, and architecture with current requirements.
    outcomes: [pass, fail, unknown]
    evidence: Timestamped host observations and the requirements verification timestamp.
  - id: clock-health
    check: Observe clock synchronization and material skew without changing time service configuration.
    outcomes: [pass, fail, unknown]
    evidence: Timestamped runtime or host clock observations.
  - id: runtime-identity
    check: Match the running process, service, or container to the registered node identity.
    outcomes: [pass, fail, unknown]
    evidence: Sanitized identity and ownership observations.
  - id: release-provenance
    check: For Nix, resolve the observed process executable from /proc/<pid>/exe, run that binary with --version, extract its git rev, read the cardano-node locked rev from the selected official release flake.lock, and compare those two cardano-node commits. Use the existing artifact/version and checksum evidence for non-Nix installations.
    outcomes: [pass, fail, conflict, unknown]
    evidence: The observed executable path, sanitized --version output, binary repository, selected release flake.lock source and cardano-node pinned revision, plus an explicit commit comparison. Missing evidence is unknown.
    semantics:
      current: pass with comparison.status match; report release provenance as current.
      conflict: comparison.status mismatch, or repository identity is not input-output-hk/cardano-node.
      fail: existing non-Nix provenance failure semantics.
      unknown: executable cannot be resolved, --version cannot be run or has no git rev, selected release flake.lock/cardano-node revision is unavailable, or either commit cannot be compared.
    required_evidence:
      - binary
      - binary_version
      - binary_commit
      - binary_repository
      - release_pinned_binary_commit
      - comparison_method
    comparison_method: Compare binary_commit with the locked rev of the cardano-node input in the selected release's flake.lock; never compare with the ouroboros-leios tag commit.
  - id: configuration-integrity
    check: Compare the canonical network-identity projection of config.json, plus topology and genesis file hashes, with current.yaml; ignore node-local tuning and tracing options without exposing secrets.
    outcomes: [pass, fail, conflict, unknown]
    evidence: Projection algorithm, selected field names, network-identity hash, file hashes, paths, and current declaration hashes.
    network_identity:
      algorithm: sha256(canonical-json)
      include:
        - Protocol
        - ConsensusMode
        - RequiresNetworkMagic
        - MinNodeVersion
        - ExperimentalHardForksEnabled
        - ExperimentalProtocolsEnabled
        - LastKnownBlockVersion-Alt
        - LastKnownBlockVersion-Major
        - LastKnownBlockVersion-Minor
        - '*HardForkAtEpoch'
        - '*GenesisFile'
        - '*GenesisHash'
      exclude:
        - 'TraceOptions.*'
        - 'TraceOption*'
        - MempoolCapacityBytesOverride
        - 'LedgerDB.QueryBatchSize'
        - 'LedgerDB.Snapshots.*'
        - 'LeiosDbConfig.Filepath'
      semantics:
        pass: The canonical projection hash matches current.yaml and all referenced genesis/topology hashes match.
        fail: The projection or a referenced network file differs from current.yaml.
        unknown: The projection cannot be built, the baseline is absent, or a new network-semantic field requires review.
  - id: storage-health
    check: Observe free space, writable node paths, and bounded storage errors without repairing filesystems.
    outcomes: [pass, fail, unknown]
    evidence: Timestamped capacity, ownership, and error observations.
  - id: startup-health
    check: Correlate runtime state with bounded fatal or crash evidence.
    outcomes: [pass, fail, unknown]
    evidence: Process state and sanitized bounded logs.
  - id: runtime-tool-discovery
    check: Resolve the running node's exact Nix runtime, its inherited PATH, an exact cardano-cli, and the node socket before issuing CLI queries.
    outcomes: [pass, conflict, unknown]
    evidence: Installation method, exact PID origin, observed cardano-node path, PATH origin, resolved cardano-cli path, sanitized CLI version, socket origin and sanitized socket path, and the resolution method.
    required_evidence: [installation_method, pid_origin, cardano_node_path, path_origin, cardano_cli_path, cardano_cli_version, socket_origin, socket_path, resolution_method]
    semantics:
      pass: CLI and socket are resolved unambiguously.
      conflict: Multiple exact evidences identify incompatible runtimes or versions.
      unknown: Permissions are insufficient, process PATH is unobservable, cardano-cli is not exactly resolvable, or the socket is unknown. SSH-session PATH absence is never sufficient evidence of absence.
    constraints:
      - Resolve PID from registered node identity; never use pgrep or broad patterns.
      - Parse /proc/<pid>/environ and /proc/<pid>/cmdline as NUL-separated data, never as shell.
      - Do not walk /nix/store globally, use sudo, nix develop, install packages, or persist a Nix path as identity.
      - Validate the exact basename, regular-file and executable properties, and Nix store resolution; validate with --version and sanitize output.
      - Prefer --socket-path from cmdline, resolve relative paths against /proc/<pid>/cwd, and otherwise use only an explicitly registered socket.
  - id: tip-trend
    check: Compare at least two time-separated tip or sync observations before classifying progress.
    outcomes: [progressing, stalled, unavailable, unknown]
    evidence: Values and timestamps; one observation is insufficient for stalled.
  - id: peer-connectivity
    check: Observe peer evidence and distinguish no peers from slow or bursty synchronization.
    outcomes: [connected, none, unavailable, unknown]
    evidence: Node telemetry, bounded logs, or runtime endpoints.
  - id: shared-host-impact
    check: Verify registered sibling nodes and unrelated shared services remain healthy.
    outcomes: [pass, fail, unknown]
    evidence: Sanitized status observations for declared shared workloads.

current_release_rules:
  - id: w31a-invalid-certificate-crash
    applies_when:
      selected_release: prototype-2026w31a
      symptom: Invalid Leios certificate crash persists after update.
    diagnosis: Confirm release provenance and exact crash evidence before recommending recovery.
    recommendation: Use recover-node to remove only volatile chain state after separate destructive confirmation.
    source: https://github.com/input-output-hk/ouroboros-leios/releases/tag/prototype-2026w31a

freshness:
  status: current-as-reviewed
  reviewed_at: "2026-08-05"
  stale_when: Requirements, network-identity projection, latest release, guide, known issues, or failure evidence changes.

verification_examples:
  - name: nix-cli-found-in-process-path
    installation_method: nix
    ssh_path: /usr/bin:/bin
    process_path: /nix/store/node-runtime/bin:/nix/store/cli-runtime/bin:/usr/bin
    pid_origin: registered-node-identity
    cardano_node_path: /nix/store/node-runtime/bin/cardano-node
    path_origin: proc-pid-environ
    cardano_cli_path: /nix/store/cli-runtime/bin/cardano-cli
    cardano_cli_version: "cardano-cli 11.1.0.164"
    socket_origin: proc-pid-cmdline
    socket_path: /srv/musashi/state/node.socket
    resolution_method: inherited-process-path
    expected_runtime_tool_discovery: pass
  - name: nix-cli-version-validates
    installation_method: nix
    pid_origin: registered-node-identity
    cardano_node_path: /nix/store/node-runtime/bin/cardano-node
    path_origin: proc-pid-environ
    cardano_cli_path: /nix/store/cli-runtime/bin/cardano-cli
    cardano_cli_version: "cardano-cli 11.1.0.164"
    socket_origin: proc-pid-cmdline
    socket_path: /srv/musashi/state/node.socket
    resolution_method: exact-runtime-path
    expected_runtime_tool_discovery: pass
  - name: nix-environ-unreadable
    installation_method: nix
    pid_origin: registered-node-identity
    cardano_node_path: /nix/store/node-runtime/bin/cardano-node
    path_origin: unavailable
    cardano_cli_path: unknown
    socket_origin: unavailable
    socket_path: unknown
    resolution_method: none
    action: no-sudo-no-change
    expected_runtime_tool_discovery: unknown
  - name: nix-incompatible-exact-evidence
    installation_method: nix
    pid_origin: registered-node-identity
    cardano_node_path: /nix/store/node-a/bin/cardano-node
    path_origin: proc-pid-environ-and-registered-runtime
    cardano_cli_path: [/nix/store/cli-a/bin/cardano-cli, /nix/store/cli-b/bin/cardano-cli]
    cardano_cli_version: ["cardano-cli 11.1.0.160", "cardano-cli 11.1.0.164"]
    socket_origin: proc-pid-cmdline
    socket_path: /srv/musashi/state/node.socket
    resolution_method: conflicting-exact-evidence
    expected_runtime_tool_discovery: conflict
  - name: socket-from-cmdline-state
    installation_method: nix
    pid_origin: registered-node-identity
    path_origin: proc-pid-environ
    cardano_cli_path: /nix/store/cli-runtime/bin/cardano-cli
    cardano_cli_version: "cardano-cli 11.1.0.164"
    socket_origin: proc-pid-cmdline
    socket_path: /srv/musashi/state/node.socket
    working_directory: /srv/musashi
    cmdline_socket_path: state/node.socket
    ignored_guess: /srv/musashi/node.socket
    resolution_method: relative-cmdline-socket-against-proc-cwd
    expected_runtime_tool_discovery: pass
  - name: shell-characters-are-literal
    installation_method: nix
    path_value: "/nix/store/cli-runtime/bin;$(touch /tmp/should-not-exist):/usr/bin"
    cmdline_socket_path: "state/$(touch /tmp/should-not-exist).socket"
    resolution_method: literal-data-only
    action: reject-invalid-candidates-without-evaluation
    expected_runtime_tool_discovery: unknown
  - name: non-nix-existing-behavior
    installation_method: package-or-binary
    resolution_method: existing-non-nix-artifact-and-checksum-rules
    expected_runtime_tool_discovery: pass
  - name: observe-never-enters-nix
    installation_method: nix
    mode: observe
    action: no-nix-develop-no-install-no-profile-change
    expected_runtime_tool_discovery: unknown
  - name: nix-release-commit-match
    selected_release: prototype-2026w31a
    binary: /nix/store/example-cardano-node/bin/cardano-node
    binary_version: "cardano-node 11.1.0.164 (git rev 6971bb527288d0f362147fbe318c0e9c84312ab3)"
    binary_commit: 6971bb527288d0f362147fbe318c0e9c84312ab3
    binary_repository: input-output-hk/cardano-node
    release_pinned_binary_commit: 6971bb527288d0f362147fbe318c0e9c84312ab3
    comparison_method: flake.lock nodes.cardano-node.locked.rev
    comparison: match
    expected_output:
      release_provenance: current
      comparison: match
      repository_comparison: input-output-hk/cardano-node
    expected_provenance: current
  - name: nix-release-commit-mismatch
    comparison: mismatch
    expected_provenance: conflict
  - name: nix-flake-lock-missing
    comparison: unknown
    expected_provenance: unknown
  - name: nix-version-rev-missing
    comparison: unknown
    expected_provenance: unknown
  - name: nix-binary-unresolved
    comparison: unknown
    expected_provenance: unknown
  - name: ouroboros-leios-checkout-differs
    binary_repository: input-output-hk/cardano-node
    comparison: match
    note: A different local ouroboros-leios checkout commit is irrelevant; the pinned cardano-node rev is authoritative.
    expected_provenance: current
