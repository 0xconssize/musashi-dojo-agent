schema_version: 1
skill: register-stake-pool
phase: 6
risk: external-onchain
scope: [single-pool, single-node]
inputs: [working_dir, synced_node_socket, pool_keys, funded_payment_address, pool_parameters, owners, relays, optional_metadata]
outputs: [stake_registration_certificate, pool_registration_certificate, signed_transaction, operation_report]
success: Registration is submitted only after confirmation and independently verified on-chain.
confirmation:
  required_for: [signing_transaction, submitting_transaction]
  invalidated_by: [command-change, target-change, input-change, key-change, parameter-change, owner-change, relay-change, metadata-change, scope-change]
network:
  name: Musashi Dojo Leios testnet
  magic: 164
  era: Dijkstra
  revalidate_when: [network-release, era-change, cli-help-change, protocol-parameter-change]
cli_options:
  relay_forms: [ipv4+port, ipv6+port, single-host-dns+optional-port, multi-host-dns-srv]
  repeatable: [pool-owner, relay]
  metadata: [metadata-url, metadata-hash, check-metadata-hash]
sources: [https://leios.cardano-scaling.org/docs/testnet/register-stake-pool/, https://github.com/0xconssize/leios, https://github.com/IntersectMBO/cardano-cli]
