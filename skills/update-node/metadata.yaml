schema_version: 1
skill: update-node
phase: 6
risk: variable-impact
scope: [single-node]
inputs: [node_id, installed_release, target_release, installation_method, verified_access, recovery]
outputs: [operation_report, node_state]
success: The node runs the selected verified release or stops safely with recovery material preserved.
confirmation:
  required_for: [host-level, destructive-broad, state-deletion, irreversible-migration]
  separate_for_recovery: true
sources:
  operational:
    url: https://leios.cardano-scaling.org/docs/testnet/getting-started/
    sections: [Run a relay, Confirm you are syncing]
    retrieved_at: "2026-08-05"
    documented_release: prototype-2026w30
  release_authority:
    url: https://github.com/input-output-hk/ouroboros-leios/releases/tag/prototype-2026w32
    latest_release: prototype-2026w32
    retrieved_at: "2026-08-12"
freshness:
  status: current-with-source-conflict
  revalidate_before: Planning every update or recovery action.
  stale_when: Latest release, assets, checksums, release notes, guide, configuration, or target state changes.
