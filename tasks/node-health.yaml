schema_version: 1
id: node-health
description: Comprobar la salud básica de un nodo Musashi.
schedule:
  type: interval
  every: 30m
skill: sre-observe
scope:
  type: single-node
  target_from: local-policy
mode: observe
operator_memory: .musashi/task-memory.md
checks:
  - process-state
  - tip-progress
  - peer-connectivity
  - recent-fatal-errors
  - release-provenance
  # Metsuke checks apply to the exact registered auxiliary component for each
  # node; metrics-only trace status is recorded as conditional/unknown and is
  # not allowed to create a false node-health failure.
  - metsuke-process-state
  - metsuke-metrics-source
  - metsuke-submission-progress
  - metsuke-trace-progress
  - metsuke-spool-state
  - metsuke-release-status
  - metsuke-node-isolation
# The generated fleet runner observes three nodes sequentially; each tip check
# keeps two observations 180 seconds apart.
timeout: 1200s
concurrency:
  policy: forbid-overlap
failure_policy:
  consecutive_failures_before_alert: 2
  cooldown: 15m
outputs:
  task_run: .musashi/task-runs/
  alert_on: [degraded, failed, unknown]
