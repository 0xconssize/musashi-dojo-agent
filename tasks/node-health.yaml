schema_version: 1
id: node-health
description: Comprobar la salud básica de un nodo Musashi.
schedule:
  type: interval
  every: 5m
skill: sre-observe
scope:
  type: single-node
  target_from: local-policy
mode: observe
checks:
  - process-state
  - tip-progress
  - peer-connectivity
  - recent-fatal-errors
  - release-provenance
timeout: 90s
concurrency:
  policy: forbid-overlap
failure_policy:
  consecutive_failures_before_alert: 2
  cooldown: 15m
outputs:
  task_run: .musashi/task-runs/
  alert_on: [degraded, failed, unknown]
