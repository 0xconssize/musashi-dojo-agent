schema_version: 1
mode: advisory
verified_at: null
runtime:
  name: null
  connection_provider: null
capabilities:
  local_shell: false
  remote_shell: false
  ssh: false
  file_read: true
  file_write: false
  file_transfer: false
  privilege_escalation: never
  container_management: false
  system_service_management: false
